name: Temporary repository and release import

on:
  push:
    paths:
      - '.github/workflows/temporary-import-roms.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-rom-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'vectras-team/Vectras-Open-Roms'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out destination
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Import Git history and releases; verify file and asset hashes
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import urllib.parse
          
          SOURCE = "wasdwasd0105/vectras-open-rom"
          DEST = "vectras-team/Vectras-Open-Roms"
          EXPECTED_MAIN = "0e9c9889edb3b0f270da02de53b2036f86b6df1d"
          
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, text=True, **kwargs)
          
          def api(endpoint, payload=None, method=None):
              cmd = ["gh", "api", endpoint]
              if method:
                  cmd += ["--method", method]
              if payload is not None:
                  cmd += ["--input", "-"]
              result = run(*cmd, input=json.dumps(payload) if payload is not None else None,
                           capture_output=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          
          def pages(endpoint):
              result = run("gh", "api", endpoint, "--paginate", "--slurp", capture_output=True)
              return [item for page in json.loads(result.stdout) for item in page]
          
          assert os.environ["GITHUB_REPOSITORY"] == DEST
          run("git", "config", "user.name", "github-actions[bot]")
          run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("git", "remote", "add", "source", "https://github.com/" + SOURCE + ".git")
          run("git", "fetch", "--no-tags", "source",
              "+refs/heads/*:refs/remotes/source/*", "+refs/tags/*:refs/tags/*")
          actual_main = run("git", "rev-parse", "refs/remotes/source/main", capture_output=True).stdout.strip()
          assert actual_main == EXPECTED_MAIN, "Source main changed; inspect before migrating"
          ancestry = subprocess.run(["git", "merge-base", "--is-ancestor", "refs/remotes/source/main", "HEAD"])
          if ancestry.returncode == 1:
              run("git", "merge", "--allow-unrelated-histories", "--no-commit", "refs/remotes/source/main")
              run("git", "commit", "-m", "Import source repository with full Git history")
          elif ancestry.returncode != 0:
              raise RuntimeError("Could not check source ancestry")
          run("git", "push", "origin", "HEAD:refs/heads/main")
          branches = run("git", "for-each-ref", "--format=%(refname)", "refs/remotes/source/",
                         capture_output=True).stdout.splitlines()
          for branch in branches:
              name = branch.removeprefix("refs/remotes/source/")
              if name != "main":
                  run("git", "push", "origin", branch + ":refs/heads/" + name)
          run("git", "push", "origin", "--tags")
          
          releases = pages("repos/" + SOURCE + "/releases?per_page=100")
          existing = {r["tag_name"]: r for r in pages("repos/" + DEST + "/releases?per_page=100")}
          asset_count = 0
          byte_count = 0
          for release in reversed(releases):
              tag = release["tag_name"]
              target = existing.get(tag)
              if target is None:
                  target = api("repos/" + DEST + "/releases", {
                      "tag_name": tag, "name": release["name"], "body": release.get("body") or "",
                      "draft": True, "prerelease": release["prerelease"], "make_latest": "false"
                  }, "POST")
              target_assets = {a["name"]: a for a in pages(
                  "repos/" + DEST + "/releases/" + str(target["id"]) + "/assets?per_page=100")}
              source_assets = pages("repos/" + SOURCE + "/releases/" + str(release["id"]) + "/assets?per_page=100")
              for asset in source_assets:
                  name = asset["name"]
                  assert Path(name).name == name and name not in (".", "..")
                  expected_digest = asset.get("digest")
                  assert expected_digest and expected_digest.startswith("sha256:"), "Missing source SHA-256"
                  copied = target_assets.get(name)
                  if copied is not None:
                      assert copied["size"] == asset["size"] and copied.get("digest") == expected_digest, \
                          "Existing destination asset differs: " + name
                  else:
                      with tempfile.TemporaryDirectory() as tmp:
                          path = Path(tmp) / name
                          run("curl", "--fail", "--location", "--retry", "4", "--retry-all-errors",
                              "--silent", "--show-error", "--output", str(path), "--", asset["browser_download_url"])
                          assert path.stat().st_size == asset["size"], "Download size mismatch: " + name
                          digest = hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
                          assert "sha256:" + digest == expected_digest, "Download hash mismatch: " + name
                          run("gh", "release", "upload", tag, str(path), "--repo", DEST)
                          uploaded = pages("repos/" + DEST + "/releases/" + str(target["id"]) + "/assets?per_page=100")
                          copied = next(a for a in uploaded if a["name"] == name)
                          assert copied["size"] == asset["size"] and copied.get("digest") == expected_digest, \
                              "Uploaded asset verification failed: " + name
                  if asset.get("label") != copied.get("label"):
                      api("repos/" + DEST + "/releases/assets/" + str(copied["id"]),
                          {"name": name, "label": asset.get("label") or ""}, "PATCH")
                  asset_count += 1
                  byte_count += asset["size"]
                  print("Verified " + name + " (" + str(asset["size"]) + " bytes)", flush=True)
              api("repos/" + DEST + "/releases/" + str(target["id"]), {
                  "name": release["name"], "body": release.get("body") or "",
                  "draft": release["draft"], "prerelease": release["prerelease"]
              }, "PATCH")
          
          source_files = run("git", "ls-tree", "-r", "refs/remotes/source/main", capture_output=True).stdout.splitlines()
          dest_files = run("git", "ls-tree", "-r", "HEAD", capture_output=True).stdout.splitlines()
          workflow_path = ".github/workflows/temporary-import-roms.yml"
          assert [line for line in dest_files if line.split("\t", 1)[1] != workflow_path] == source_files
          summary = "Copied full Git history, branches and tags; " + str(len(releases)) + \
                    " releases and " + str(asset_count) + " assets (" + str(byte_count) + \
                    " bytes). All file trees and asset SHA-256 hashes verified.\n"
          print(summary, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
